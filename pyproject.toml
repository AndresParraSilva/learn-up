[project]
name = "learn-up-skill"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "crap4py",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=learn_up_installer",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=json",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["learn_up_installer"]
branch = true

[tool.coverage.json]
output = "coverage.json"

[tool.ruff]
target-version = "py310"
extend-exclude = ["skills/learn-up/references"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false

[tool.uv.sources]
crap4py = { git = "https://github.com/AndresParraSilva/crap4py.git", rev = "fix/silent-100pct-on-coverage-miss" }
